[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtunnel"
version = "0.1.0"
description = "A Windows desktop VPN discovery and connection manager for developers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DevTunnel Contributors" }]
dependencies = [
    "PySide6>=6.10.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
